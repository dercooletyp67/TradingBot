<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>TradingBot Dashboard (cloud)</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e6e8ec;
    --muted: #8a90a2;
    --green: #3ddc97;
    --red: #ff5c72;
    --amber: #e0b34d;
    --accent: #5b8def;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .status-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px; font-size: 12px;
    background: var(--panel); border: 1px solid var(--border);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.running { background: var(--green); }
  .dot.stale { background: var(--amber); }
  .dot.halted { background: var(--red); }
  .halted-banner {
    margin: 10px 0; padding: 10px 14px; border-radius: 8px;
    background: rgba(255,92,114,0.12); border: 1px solid var(--red);
    color: var(--red); font-size: 13px; display: none;
  }
  .halted-banner.show { display: block; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin: 20px 0;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .card .label { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .card .value { font-size: 22px; font-weight: 600; }
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .panel h2 { font-size: 14px; margin: 0 0 12px; color: var(--muted); font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  .empty { color: var(--muted); font-size: 13px; padding: 20px; text-align: center; }
  .note { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .nav { margin-bottom: 12px; }
  .nav a { color: var(--accent); font-size: 13px; text-decoration: none; }
  .nav a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="nav"><a href="btc.html">View BTC-USD instance &rarr;</a></div>
  <h1>TradingBot Dashboard &mdash; EUR/USD</h1>
  <div class="subtitle">Paper trading, run on a schedule by GitHub Actions &mdash; no real money at risk, no broker account</div>
  <span class="status-pill"><span class="dot" id="statusDot"></span><span id="statusText">loading...</span></span>
  <div class="note" id="heartbeatNote"></div>
  <div class="halted-banner" id="haltedBanner"></div>

  <div class="grid" id="statsGrid"></div>

  <div class="panel">
    <h2>Equity Curve</h2>
    <canvas id="equityChart" height="90"></canvas>
  </div>

  <div class="panel">
    <h2>Recent Trades</h2>
    <div id="tradesContainer"></div>
  </div>

  <div class="panel">
    <h2>Auto Re-tune History</h2>
    <div id="retunesContainer"></div>
  </div>

<script>
// Data refreshes only when the scheduled GitHub Actions run pushes a new
// commit -- typically every 30 min, see .github/workflows/paper_trade.yml.
// Re-fetching more often than that just re-reads the same files.
const STALE_AFTER_MINUTES = 90;

async function fetchJSON(url) {
  const r = await fetch(url + "?_=" + Date.now());
  if (!r.ok) throw new Error(`${url}: ${r.status}`);
  return r.json();
}

function fmtMoney(v) {
  if (v === null || v === undefined) return "&mdash;";
  return "$" + Number(v).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function fmtUnits(v) {
  if (v === null || v === undefined) return "&mdash;";
  // trims to 6 decimals and drops trailing zeros -- raw floats from
  // fractional crypto sizing are otherwise 15+ digits long.
  return Number(v).toFixed(6).replace(/\.?0+$/, "");
}

function fmtPct(v) {
  if (v === null || v === undefined) return "&mdash;";
  const cls = v >= 0 ? "pos" : "neg";
  return `<span class="${cls}">${v >= 0 ? "+" : ""}${v.toFixed(2)}%</span>`;
}

let chart;

async function refresh() {
  let status, stats, equity, trades, retunes;
  try {
    [status, stats, equity, trades, retunes] = await Promise.all([
      fetchJSON("data/status.json"),
      fetchJSON("data/stats.json"),
      fetchJSON("data/equity.json"),
      fetchJSON("data/trades.json"),
      fetchJSON("data/retunes.json"),
    ]);
  } catch (e) {
    document.getElementById("statusText").textContent = "Waiting for first scheduled run...";
    document.getElementById("heartbeatNote").textContent =
      "No data published yet -- the GitHub Actions workflow hasn't completed its first tick.";
    return;
  }

  const dot = document.getElementById("statusDot");
  const text = document.getElementById("statusText");
  const note = document.getElementById("heartbeatNote");

  const lastHeartbeat = status.last_heartbeat ? new Date(status.last_heartbeat + "Z") : null;
  const minutesSince = lastHeartbeat ? (Date.now() - lastHeartbeat.getTime()) / 60000 : null;
  const isStale = minutesSince === null || minutesSince > STALE_AFTER_MINUTES;

  const banner = document.getElementById("haltedBanner");
  banner.className = "halted-banner";

  if (status.trading_halted) {
    dot.className = "dot halted";
    text.textContent = `HALTED — ${status.strategy} on ${status.instrument}`;
    banner.className = "halted-banner show";
    banner.textContent = `\u{1F6D1} Kill switch tripped${status.halted_at ? " at " + new Date(status.halted_at + "Z").toLocaleString() : ""}: ${status.halted_reason || "drawdown limit exceeded"}. Position flattened. Cleared with --resume-trading.`;
  } else if (!status.strategy) {
    dot.className = "dot";
    text.textContent = "Not started yet";
    note.textContent = "";
  } else if (isStale) {
    dot.className = "dot stale";
    text.textContent = `Stale — ${status.strategy} on ${status.instrument}`;
    note.textContent = lastHeartbeat
      ? `Last tick ${lastHeartbeat.toLocaleString()} (${Math.round(minutesSince)} min ago) — scheduled run may be delayed or paused.`
      : "No heartbeat recorded yet.";
  } else {
    dot.className = "dot running";
    text.textContent = `Active — ${status.strategy} on ${status.instrument}`;
    note.textContent = `Last tick ${lastHeartbeat.toLocaleString()} (${Math.round(minutesSince)} min ago)`;
  }

  document.getElementById("statsGrid").innerHTML = `
    <div class="card"><div class="label">Balance</div><div class="value">${fmtMoney(stats.current_balance)}</div></div>
    <div class="card"><div class="label">Total Return</div><div class="value">${fmtPct(stats.total_return_pct)}</div></div>
    <div class="card"><div class="label">Max Drawdown</div><div class="value">${fmtPct(stats.max_drawdown_pct)}</div></div>
    <div class="card"><div class="label">Trades</div><div class="value">${stats.num_trades ?? 0}</div></div>
    <div class="card"><div class="label">Win Rate</div><div class="value">${(stats.win_rate_pct ?? 0).toFixed(1)}%</div></div>
  `;

  const labels = equity.map(e => new Date(e.timestamp + "Z").toLocaleString());
  const values = equity.map(e => e.balance + e.unrealized_pnl);

  if (!chart) {
    const ctx = document.getElementById("equityChart").getContext("2d");
    chart = new Chart(ctx, {
      type: "line",
      data: { labels, datasets: [{ label: "Equity", data: values, borderColor: "#5b8def", backgroundColor: "rgba(91,141,239,0.1)", fill: true, tension: 0.15, pointRadius: 0 }] },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: "#8a90a2", maxTicksLimit: 8 }, grid: { color: "#262b36" } },
          y: { ticks: { color: "#8a90a2" }, grid: { color: "#262b36" } },
        },
      },
    });
  } else {
    chart.data.labels = labels;
    chart.data.datasets[0].data = values;
    chart.update();
  }

  const container = document.getElementById("tradesContainer");
  if (!trades.length) {
    container.innerHTML = '<div class="empty">No trades yet.</div>';
  } else {
    const rows = trades.map(t => `
      <tr>
        <td>${new Date(t.timestamp + "Z").toLocaleString()}</td>
        <td>${t.instrument}</td>
        <td style="color:${t.side === 'buy' ? '#3ddc97' : '#ff5c72'}">${t.side.toUpperCase()}</td>
        <td>${fmtUnits(t.units)}</td>
        <td>${t.price}</td>
        <td>${t.pnl != null ? fmtMoney(t.pnl) : "&mdash;"}</td>
      </tr>`).join("");
    container.innerHTML = `
      <table>
        <thead><tr><th>Time</th><th>Instrument</th><th>Side</th><th>Units</th><th>Price</th><th>PnL</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  const retuneContainer = document.getElementById("retunesContainer");
  if (!retunes.length) {
    retuneContainer.innerHTML = '<div class="empty">No re-tune cycles yet.</div>';
  } else {
    const rows = retunes.map(r => {
      const oldLabel = r.old_strategy ? `${r.old_strategy}${r.old_params_json}` : "&mdash;";
      const newLabel = `${r.new_strategy}${r.new_params_json}`;
      const changedLabel = r.changed
        ? `<span class="pos">switched</span>`
        : `<span style="color:var(--muted)">kept current</span>`;
      const sharpe = r.mean_test_sharpe != null ? r.mean_test_sharpe.toFixed(2) : "&mdash;";
      const gap = r.overfit_gap != null ? r.overfit_gap.toFixed(2) : "&mdash;";
      const noiseBar = r.expected_max_null != null ? r.expected_max_null.toFixed(2) : "&mdash;";
      const clearsBar = r.clears_null_bar == null ? "&mdash;"
        : r.clears_null_bar ? `<span class="pos">clears</span>` : `<span class="neg">noise</span>`;
      return `
        <tr>
          <td>${new Date(r.timestamp + "Z").toLocaleString()}</td>
          <td>${changedLabel}</td>
          <td style="font-size:12px">${oldLabel}</td>
          <td style="font-size:12px">${newLabel}</td>
          <td>${sharpe}</td>
          <td>${gap}</td>
          <td>${r.n_trials ?? "&mdash;"}</td>
          <td>${noiseBar}</td>
          <td>${clearsBar}</td>
        </tr>`;
    }).join("");
    retuneContainer.innerHTML = `
      <table>
        <thead><tr><th>Time</th><th>Result</th><th>Old</th><th>New</th><th>OOS Sharpe</th><th>Overfit Gap</th><th>Trials</th><th>Noise Bar</th><th>vs. Noise</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div style="font-size:11px;color:var(--muted);margin-top:8px">"Noise Bar" = the Sharpe you'd expect from pure luck given how many
      combinations were searched that cycle. "clears" means the result beat that benchmark; "noise" means it's
      statistically indistinguishable from what that much searching would produce with zero real skill.</div>`;
  }
}

refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
