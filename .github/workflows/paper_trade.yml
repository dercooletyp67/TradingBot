name: Paper Trade

# Runs the paper trader on a schedule instead of as a long-lived process --
# GitHub Actions runners are ephemeral, so each run does one check-and-
# maybe-trade cycle (--once) and commits the updated state back to the repo.
# See live/paper_trader.py's run_paper_trader_once() and README.md.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: paper-trade
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Keeps this instance's state separate from any local desktop instance's
  # storage/tradingbot.db + learn/ -- see config.py.
  TRADINGBOT_DB_PATH: storage/cloud_tradingbot.db
  TRADINGBOT_LEARN_DIR: learn_cloud
  # Optional. Add a repo secret named DISCORD_WEBHOOK_URL (Settings ->
  # Secrets and variables -> Actions -> New repository secret) to get
  # trade-fill and re-tune notifications. Leave it unset and this is just
  # empty -- live/notify.py silently skips notifications either way.
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Edit the strategy/params/instrument here to change the initial
      # seed -- only matters on the very first-ever run; every run after
      # that resumes from whatever's already persisted (including
      # whatever auto-retune has since switched to).
      - name: Run one paper-trader tick
        run: >
          python run_paper_trader.py --once
          --strategy rsi_reversion --params period=21,oversold=20,overbought=80
          --instrument EUR_USD --granularity H1
          --auto-retune-hours 6 --retune-search grid
          --position-sizing volatility --risk-pct 0.01

      - name: Export dashboard data
        run: python export_dashboard_data.py

      - name: Commit and push updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add storage/cloud_tradingbot.db learn_cloud docs/data
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Bot tick: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          # A second workflow (BTC instance) shares this branch, so a push
          # can occasionally get rejected as non-fast-forward -- rebase and
          # retry rather than losing this tick.
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected, pulling and retrying ($i)..."
            git pull --rebase origin main
          done
          echo "Failed to push after retries" >&2
          exit 1
