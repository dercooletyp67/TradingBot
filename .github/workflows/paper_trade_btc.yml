name: Paper Trade BTC

# BTC-USD instance -- a fully separate bot from paper_trade.yml (EUR/USD):
# own state files, own starting balance, own dashboard page (docs/btc.html).
# Offset 15 min from paper_trade.yml's schedule so the two rarely try to
# push at the same moment (the push step retries either way if they do).
# See paper_trade.yml and README.md for how this pattern works.

on:
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch: {}

concurrency:
  group: paper-trade-btc
  cancel-in-progress: false

permissions:
  contents: write

env:
  TRADINGBOT_DB_PATH: storage/cloud_tradingbot_btc.db
  TRADINGBOT_LEARN_DIR: learn_cloud_btc
  TRADINGBOT_DOCS_SUBDIR: data-btc
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Seed picked by running run_optimize.py --instrument BTC-USD on
      # 2026-08-24 (rsi_reversion, period=7/oversold=25/overbought=80 topped
      # out-of-sample Sharpe 1.89 with a small overfit gap). Only matters on
      # the very first-ever run -- every run after resumes from whatever's
      # already persisted (including whatever auto-retune has switched to).
      - name: Run one paper-trader tick
        run: >
          python run_paper_trader.py --once
          --strategy rsi_reversion --params period=7,oversold=25,overbought=80
          --instrument BTC-USD --granularity H1
          --auto-retune-hours 6 --retune-search grid
          --position-sizing volatility --risk-pct 0.01

      - name: Export dashboard data
        run: python export_dashboard_data.py

      - name: Commit and push updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add storage/cloud_tradingbot_btc.db learn_cloud_btc docs/data-btc
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Bot tick (BTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected, pulling and retrying ($i)..."
            git pull --rebase origin main
          done
          echo "Failed to push after retries" >&2
          exit 1
